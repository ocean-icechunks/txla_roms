[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"


[project]
name = "txla_roms_icechunk"
version = "0.1.0"
description = "Keep a virtual Icechunk store of the TXLA ROMS forecast archive (TAMU-CC) up to date with GitHub Actions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
# Keep in step with [tool.pixi.dependencies] so uv installs (CI tests) resolve the same
# releases the production pixi environment (the update workflow) runs. Tested 2026-11-19
# with Python 3.13, icechunk 2.3.1, virtualizarr 2.8.0, xarray 2026.9.0, zarr 3.4.2.
dependencies = [
  "icechunk >=2.3.1,<3",
  "zarr >=3.4,<3.5",
  "xarray >=2026.9.0",
  "virtualizarr >=2.8,<3",
  "numpy >=2",
  "netCDF4 >=1.7.5",
  "typer >=0.12",
  "obstore >=0.12",
  "obspec-utils >=0.9",
]

[project.scripts]
txla = "txla_roms_icechunk.cli:main"


[dependency-groups]
test = [
  "pytest >=9",
  "pytest-cov >=7",
]
dev = [
  { include-group = "test" },
  "dask",
  "matplotlib",
  "jupyterlab",
]


[tool.pytest]
minversion = "9.0"
# Network-marked tests hit TAMU-CC's server; run them explicitly with `pytest -m network`.
addopts = ["-ra", "--showlocals", "-m", "not network"]
strict = true
markers = [
  "network: requires internet access to TAMU-CC's public web server",
]
filterwarnings = [
  "error",
  "ignore:Numcodecs codecs are not in the Zarr version 3 specification:UserWarning",
  "ignore::xarray.coding.variables.SerializationWarning",
]
log_level = "INFO"
testpaths = [
  "tests",
]


[tool.coverage]
run.source = ["txla_roms_icechunk"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]


[tool.ruff]
show-fixes = true
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
extend-select = [
  "ARG", "B", "C4", "EM", "EXE", "FURB", "G", "ICN", "ISC", "LOG", "NPY", "PERF",
  "PGH", "PL", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "SIM", "SLOT", "T10",
  "T20", "TC", "UP",
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "C408",     # dict() calls mirror keyword-style attrs
  "PLC0415",  # imports inside functions (heavy optional imports)
  "N",        # model variable names (F, B, NZ) follow the source
  "S101",     # asserts narrow optional types
  "SLF001",   # VirtualiZarr manifests expose _paths/_offsets/_lengths only
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]


[tool.pylint]
py-version = "3.12"
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
# C-extension members pylint cannot introspect
typecheck.generated-members = ["netCDF4.*", ".*StringDType"]
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  "invalid-name",
  "protected-access",
  "wrong-import-position",
  "unused-import",           # ruff F401 covers this; build.py re-exports helpers for the notebooks
  "use-dict-literal",        # ruff C408 is ignored on purpose
  "broad-exception-caught",  # retry loops re-raise after the last attempt
  "global-statement",        # one object-store registry per worker process
]

[tool.uv]
exclude-newer = "3 days"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
exclude-newer = "3d"

[tool.pixi.dependencies]
python = ">=3.15,<3.16"
icechunk = ">=2.3.1,<3"
zarr = ">=3.4,<3.5"
xarray = ">=2026.9.0"
virtualizarr = ">=2.8,<3"
numpy = ">=2"
netcdf4 = ">=1.7.5"
typer = ">=0.12"

[tool.pixi.pypi-dependencies]
txla_roms_icechunk = { path = ".", editable = true }
obstore = ">=0.12"
obspec-utils = ">=0.9"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
txla-source-coop = "AWS_PROFILE=source-coop TXLA_S3_BUCKET=ocean-icechunks TXLA_S3_PREFIX=txla-roms/txla_roms.icechunk TXLA_S3_ENDPOINT=https://data.source.coop pixi run txla"
