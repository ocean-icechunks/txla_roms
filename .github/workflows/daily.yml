name: Daily update

# Refresh the published store from TAMU-CC's archive. Best-effort by design: `txla update`
# compares the source listing with the fingerprint recorded on `main` and rebuilds only when
# something changed, so a failed or skipped run needs no retry - the next run catches up.
# Every run also writes the store status to the step summary and (if TXLA_STATUS_ISSUE is set)
# to a pinned issue, and re-enables this workflow so GitHub's 60-day inactivity rule never
# disables the schedule. See docs/operations.md.

on:
  workflow_dispatch: # and by hand, from the Actions tab
    inputs:
      force:
        description: Rebuild even if the source listing is unchanged
        type: boolean
        default: false
      create:
        description: >-
          Create the store if it does not exist yet (first run only; every other
          run refuses to create one, so a wrong prefix fails instead of silently
          starting a new store)
        type: boolean
        default: false
  schedule:
    # Nightly at 02:00 UTC; works only if main is the default branch. A run reaches history/
    # the night after it is in latest/. Runs with an unchanged listing are a no-op.
    - cron: "0 2 * * *"

permissions: {}

# Exactly one writer against the store, ever. Queued runs wait; nothing is cancelled
# mid-commit.
concurrency:
  group: txla-store
  cancel-in-progress: false

env:
  FORCE_COLOR: 3
  # Source Cooperative's data proxy (S3 API) and STS endpoint.
  SOURCE_COOP: https://data.source.coop

jobs:
  update:
    name: Update store
    runs-on: ubuntu-latest
    # Only the upstream repository writes the store; forks and copies skip.
    if: github.repository == 'ocean-icechunks/txla_roms'
    # No `environment:` here: Source Cooperative trusts this repository's main branch, and an
    # environment would change the OIDC subject claim the service account is matched on.
    timeout-minutes: 45
    outputs:
      status: ${{ steps.status.outputs.markdown }}
    permissions:
      contents: read
      id-token: write # required for aws-actions/configure-aws-credentials (OIDC sign-in)
    env:
      # No job-wide AWS_ENDPOINT_URL: the CLI passes the endpoint explicitly, so nothing else
      # is routed through the proxy by accident. Repository variables override the defaults.
      TXLA_S3_BUCKET: ${{ vars.TXLA_S3_BUCKET || 'ocean-icechunks' }}
      TXLA_S3_PREFIX:
        ${{ vars.TXLA_S3_PREFIX || 'txla-roms/txla_roms.icechunk' }}
      TXLA_S3_REGION: ${{ vars.TXLA_S3_REGION || 'us-west-2' }}
      TXLA_S3_ENDPOINT:
        ${{ vars.TXLA_S3_ENDPOINT || 'https://data.source.coop' }}
      TXLA_S3_ACL: ${{ vars.TXLA_S3_ACL || 'bucket-owner-full-control' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name:
          Sign in to Source Cooperative as
          ocean-icechunks--txla-roms-update-store
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::ocean-icechunks--txla-roms-update-store:role/FullAccess
          audience: ${{ env.SOURCE_COOP }}
          sts-endpoint: ${{ env.SOURCE_COOP }}/.sts
          aws-region: us-west-2
          # Icechunk keeps the first credentials it reads (no mid-run renewal); outlive
          # timeout-minutes. See docs/operations.md#credentials.
          role-duration-seconds: 7200

      # From here on, the AWS SDKs act as ocean-icechunks--txla-roms-update-store. Fail fast,
      # with a clear error, if the sign-in does not reach the product.
      # (`aws s3 ls` exits 1 on an empty prefix, which a new product is; list-objects-v2
      # succeeds on an empty prefix and still fails on a denied or broken sign-in.)
      - name: Check destination access
        run: >-
          aws s3api list-objects-v2 --bucket "$TXLA_S3_BUCKET" --prefix
          "${TXLA_S3_PREFIX%%/*}/" --max-keys 5 --query "KeyCount"
          --endpoint-url "$SOURCE_COOP"

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        id: pixi
        with:
          environments: default

      - name: Update store
        env:
          FORCE: ${{ inputs.force && '--force' || '--no-force' }}
          CREATE: ${{ inputs.create && '--create' || '--no-create' }}
        run: pixi run txla update "$FORCE" "$CREATE"

      # Runs even after a failed update so the summary/issue still show where the store
      # stands (it can still fail itself if the store is unreachable).
      - name: Store status
        id: status
        if: always() && steps.pixi.outcome == 'success'
        run: |
          # Redirect rather than pipe through tee: the default shell has no pipefail.
          pixi run txla status --format markdown > status.md
          cat status.md
          cat status.md >> "$GITHUB_STEP_SUMMARY"
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "markdown<<$delimiter"
            cat status.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  report:
    name: Report status
    runs-on: ubuntu-latest
    needs: update
    if: always() && github.repository == 'ocean-icechunks/txla_roms'
    timeout-minutes: 5
    permissions:
      actions: write # re-enable this workflow (keepalive)
      issues: write # edit the status issue
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # GitHub disables scheduled workflows in public repos after 60 days without repo
      # activity. Re-enabling an already-enabled workflow resets that clock.
      - name: Keepalive (re-enable this workflow)
        run:
          gh api -X PUT
          "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/enable"

      - name: Update status issue
        if: vars.TXLA_STATUS_ISSUE != ''
        env:
          ISSUE: ${{ vars.TXLA_STATUS_ISSUE }}
          RESULT: ${{ needs.update.result }}
          EVENT: ${{ github.event_name }}
          STATUS_MD: ${{ needs.update.outputs.status }}
        run: |
          case "$RESULT" in
            success) icon="✅" ;;
            failure) icon="❌" ;;
            *) icon="⚠️" ;;
          esac
          {
            echo "## TXLA ROMS forecast (TAMU-CC) store status"
            echo
            echo "- Last run: $icon $RESULT ([run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))"
            echo "- Updated: $(date -u '+%Y-%m-%d %H:%M UTC') (trigger: $EVENT)"
            echo
            if [ -n "$STATUS_MD" ]; then
              printf '%s\n' "$STATUS_MD"
            else
              echo "_Status unavailable — see run log._"
            fi
            echo
            echo "---"
            echo "_This issue is updated automatically by \`daily.yml\`; manual edits will be overwritten._"
          } > body.md
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file body.md
